name: Build CiviShot APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build APK with Buildozer
      uses: ArtemShedov/buildozer-action@v1
      with:
        command: buildozer android debug
        repository_root: .

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: CiviShot-App
        path: bin/*.apk

